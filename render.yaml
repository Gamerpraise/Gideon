# Optional: "New → Blueprint" on Render fills these in for you. You can also create the Web
# Service by hand (see README) — both work the same.
services:
  - type: web
    name: gideon-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MAX_BOTS
        value: 8
      - key: MONGODB_URI
        sync: false
      - key: DATA_KEY
        sync: false
